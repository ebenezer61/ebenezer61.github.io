name: Mock trading backtest

# Reruns every strategy in tools/mock_trading/backtest.py on fresh FinMind bars
# and commits mock_trading/data/backtest.json. Weekly is enough: the page
# compares rules over years, not days.

on:
  schedule:
    # 22:17 UTC Saturday = 06:17 Taipei Sunday, after the week's last Taipei
    # session has settled at FinMind. Off the :00/:30 marks, which GitHub delays.
    - cron: "17 22 * * 6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mock-trading.yml"
      - "tools/mock_trading/**"

permissions:
  contents: write

concurrency:
  group: mock-trading
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/mock_trading/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/mock_trading/requirements.txt

      - name: Download bars and run every strategy
        # FINMIND_API_TOKEN is a repository secret (Settings > Secrets and
        # variables > Actions). The step fails clearly without it.
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: python tools/mock_trading/backtest.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mock_trading/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "mock_trading: weekly backtest $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
