name: Stocks daily update

on:
  schedule:
    # 23:47 UTC, Monday to Friday = 07:47 Asia/Taipei the next morning,
    # after both TWSE (13:30 Taipei) and NYSE (16:00 New York) have closed.
    # Off the :00/:30 marks: GitHub delays or drops schedules at busy minutes.
    - cron: "47 23 * * 1-5"
    # Second pass at 03:47 UTC (11:47 Taipei, before New York opens): Yahoo's
    # end-of-day bar for a US session is sometimes still missing hours after the
    # close, and the run above may execute up to two hours late. Runs are
    # idempotent, and predict.py only uses sessions that have closed, so the
    # Taipei session in progress at this hour is ignored.
    - cron: "47 3 * * 2-6"
    # Afternoon pass at 06:17 UTC (14:17 Taipei, after the 13:30 close): resolves
    # the outcomes of the morning's Taiwan forecasts so the track record and
    # the log update the same day. No new Taiwan forecast is made then, since
    # its features need the US session that closes at 04:00 Taipei; predict.py
    # keeps the morning's forecasts for a market whose inputs are not complete.
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
  # Run once on every change to the pipeline itself, so a broken step shows up
  # right away instead of at the next morning's schedule.
  push:
    branches: [main]
    paths:
      - ".github/workflows/stocks.yml"
      - "tools/stocks/**"
      - "!tools/stocks/cache/**"
      - "!tools/stocks/experiments/**"

permissions:
  contents: write

concurrency:
  group: stocks-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/stocks/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/stocks/requirements.txt

      - name: Download data, retrain, forecast
        run: python tools/stocks/predict.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data tools/stocks/cache
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "stocks: daily update $(date -u +%Y-%m-%d)"
          # Another run or a manual push may have landed meanwhile; replay this
          # commit on top and, if the same data file changed on both sides, keep
          # this run's version (it was regenerated from the newer download).
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
